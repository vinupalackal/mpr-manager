services:
  mprm-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-plane-runtime-manager:dev
    container_name: mprm-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    tty: true
    stdin_open: true

  mprm-ci:
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-plane-runtime-manager:dev
    container_name: mprm-ci
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      bash -lc "./scripts/container-ci.sh"
