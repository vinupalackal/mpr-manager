<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6cdf"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .text { font: 14px Arial, sans-serif; fill: #374151; }
      .box { rx: 12; ry: 12; stroke: #334155; stroke-width: 2; fill: #f8fafc; }
      .plane { rx: 12; ry: 12; stroke: #1d4ed8; stroke-width: 2; fill: #eff6ff; }
      .arrow { stroke: #2d6cdf; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="24" y="36" class="title">Multi-Plane Runtime Routing (Cloud Request to Plane Tool)</text>

  <rect class="box" x="40" y="90" width="220" height="70"/>
  <text x="68" y="125" class="label">Cloud / OPS Gateway</text>

  <rect class="box" x="320" y="90" width="200" height="70"/>
  <text x="382" y="125" class="label">Parodus</text>

  <rect class="box" x="580" y="70" width="280" height="120"/>
  <text x="620" y="105" class="label">Multi-Plane Runtime Manager</text>
  <text x="610" y="132" class="text">Decode WRP + payload metadata</text>
  <text x="610" y="154" class="text">Resolve plane + tool + policy</text>

  <rect class="plane" x="920" y="40" width="220" height="70"/>
  <text x="995" y="80" class="label">Triage Plane</text>

  <rect class="plane" x="920" y="125" width="220" height="70"/>
  <text x="962" y="165" class="label">Management Plane</text>

  <rect class="plane" x="920" y="210" width="220" height="70"/>
  <text x="982" y="250" class="label">Control Plane</text>

  <rect class="plane" x="920" y="295" width="220" height="70"/>
  <text x="952" y="335" class="label">Config-Apply Plane</text>

  <line class="arrow" x1="260" y1="125" x2="320" y2="125"/>
  <line class="arrow" x1="520" y1="125" x2="580" y2="125"/>

  <line class="arrow" x1="860" y1="95" x2="920" y2="75"/>
  <line class="arrow" x1="860" y1="120" x2="920" y2="160"/>
  <line class="arrow" x1="860" y1="145" x2="920" y2="245"/>
  <line class="arrow" x1="860" y1="170" x2="920" y2="330"/>

  <line class="arrow" x1="920" y1="390" x2="220" y2="430"/>
  <text x="360" y="423" class="text">Response (exit_code + stdout/error token)</text>

  <rect class="box" x="40" y="385" width="220" height="70"/>
  <text x="78" y="426" class="label">Cloud Receives Result</text>
</svg>
