# Multi-Plane Runtime Manager runtime configuration defaults
# Environment variables override these values.
# MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_POLL_INTERVAL_SEC=0 disables periodic scans.
# On Linux this uses notify-based auto reload; otherwise use SIGHUP for one-shot reload.
# Runtime .conf discovery override (set as environment variable):
# MULTI_PLANE_RUNTIME_MANAGER_CONFIG_FILE=/etc/multi-plane-runtime-manager/multi-plane-runtime-manager.conf

# Catalog JSON directory and per-plane file names
MULTI_PLANE_RUNTIME_MANAGER_CATALOG_DIR=/etc/multi-plane-runtime-manager
MULTI_PLANE_RUNTIME_MANAGER_CATALOG_FILE_TRIAGE=multi-plane-runtime-manager-triage-catalog.json
MULTI_PLANE_RUNTIME_MANAGER_CATALOG_FILE_MANAGEMENT=multi-plane-runtime-manager-management-catalog.json
MULTI_PLANE_RUNTIME_MANAGER_CATALOG_FILE_CONTROL=multi-plane-runtime-manager-control-catalog.json
MULTI_PLANE_RUNTIME_MANAGER_CATALOG_FILE_CONFIG_APPLY=multi-plane-runtime-manager-config-apply-catalog.json

# Logging controls
# MULTI_PLANE_RUNTIME_MANAGER_LOG_ENABLE: master switch for all multi-plane-runtime-manager logs
# MULTI_PLANE_RUNTIME_MANAGER_LOG_FILE_ENABLE: enable/disable file sink
# MULTI_PLANE_RUNTIME_MANAGER_LOG_FILE_PATH: full path to log file
# MULTI_PLANE_RUNTIME_MANAGER_LOG_TRACE_API: per-API/functionality trace logs
# MULTI_PLANE_RUNTIME_MANAGER_LOG_TRACE_DATA_IO: request/response and data I/O logs
MULTI_PLANE_RUNTIME_MANAGER_LOG_ENABLE=1
MULTI_PLANE_RUNTIME_MANAGER_LOG_FILE_ENABLE=1
MULTI_PLANE_RUNTIME_MANAGER_LOG_FILE_PATH=/tmp/logs/multi-plane-runtime-manager.log
MULTI_PLANE_RUNTIME_MANAGER_LOG_TRACE_API=1
MULTI_PLANE_RUNTIME_MANAGER_LOG_TRACE_DATA_IO=1

MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_ENABLE=0
# Fallback plugin directory when no per-plane directories are configured.
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_DIR=/usr/lib/multi-plane-runtime-manager/plugins
# Optional per-plane plugin directories (if any of these are set, runtime uses
# the combined per-plane directory list for discovery/reload).
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_DIR_TRIAGE=/usr/lib/multi-plane-runtime-manager/plugins/triage
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_DIR_MANAGEMENT=/usr/lib/multi-plane-runtime-manager/plugins/management
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_DIR_CONTROL=/usr/lib/multi-plane-runtime-manager/plugins/control
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_DIR_CONFIG_APPLY=/usr/lib/multi-plane-runtime-manager/plugins/config-apply
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_POLL_INTERVAL_SEC=0
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_CONFLICT_POLICY=reject-plugin-tool
MULTI_PLANE_RUNTIME_MANAGER_PLUGIN_VERIFY_MODE=off
